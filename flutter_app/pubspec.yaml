name: songpilot
description: SongPilot - AI songwriting assistant and musician collaboration app.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  audioplayers: '>=5.2.0 <8.0.0'
  record: '>=5.1.0 <8.0.0'
  shared_preferences: '>=2.3.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
