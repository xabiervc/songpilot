name: One-off codemod - editor screen deprecation

on:
  push:
    paths:
      - .github/workflows/codemod-editor-deprecation.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate DropdownButtonFormField value -> initialValue
        run: |
          set -e
          sed -i '77s/value:/initialValue:/; 88s/value:/initialValue:/; 99s/value:/initialValue:/' flutter_app/lib/screens/editor_screen.dart
          echo 'Verification - lines 77, 88, 99 now read:'
          sed -n '77p;88p;99p' flutter_app/lib/screens/editor_screen.dart
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/screens/editor_screen.dart
          git diff --cached --quiet || git commit -m "editor: migrate DropdownButtonFormField value -> initialValue (Flutter 3.33+)"
          git push
